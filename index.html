<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WU Multi-Currency Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --wu-yellow: #ffd100;
            --bg-grad-1: #1e293b;
            --bg-grad-2: #020617;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            color: var(--text-main);
            min-height: 100vh;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
        }

        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        .credits { font-size: 0.85rem; color: var(--text-muted); opacity: 0.8; }

        .bot-status {
            text-align: right; background: rgba(255,209,0,0.1); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,209,0,0.3);
        }

        .controls-wrapper { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; justify-content: space-between; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .currency-controls button { font-weight: bold; }

        button {
            background: transparent; color: var(--text-muted); border: 1px solid var(--glass-border);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem;
        }
        button:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
        button.active { border-color: var(--wu-yellow); color: var(--wu-yellow); }

        .date-picker-group { display: none; align-items: center; gap: 10px; }
        .date-picker-group.show { display: flex; }
        input[type="date"] {
            background: rgba(0, 0, 0, 0.3); color: var(--text-main); border: 1px solid var(--glass-border); padding: 7px; border-radius: 6px; color-scheme: dark;
        }

        .dashboard { 
            display: grid; 
            grid-template-columns: 350px 1fr; 
            gap: 20px; 
            align-items: start; 
        }
        
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .list-container { order: 2; }
            .chart-container { order: 1; }
        }

        .list-container { max-height: 500px; overflow-y: auto; padding-right: 10px; }
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .list-item {
            padding: 12px 16px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;
            transition: background 0.3s ease; border-radius: 8px; margin-bottom: 4px;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item.highlight { background: rgba(255, 209, 0, 0.15); border: 1px solid rgba(255, 209, 0, 0.3); }

        .item-left { display: flex; flex-direction: column; gap: 4px; }
        .item-date { font-size: 0.85rem; color: var(--text-muted); }
        .item-rate { font-size: 1.1rem; font-weight: 600; }
        .item-ib { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
        
        .item-right { text-align: right; }
        .item-delta { font-size: 0.85rem; font-weight: 500; }
        .delta-up { color: var(--green); }
        .delta-down { color: var(--red); }
        .delta-neutral { color: var(--text-muted); }

        .chart-container { 
            position: relative; 
            height: 500px; 
            width: 100%; 
            min-width: 0; /* DAS BEHEBT DEN VERSTECKTEN CSS-GRID SCALING BUG! */
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Western Union Tracker</h1>
            <div class="credits">made by Adrian / for @all</div>
        </div>
        <div class="bot-status">
            <div style="font-size: 0.8rem; color: var(--wu-yellow); font-weight: bold;">🤖 Version: 2.1 (Fix & Multi)</div>
            <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 3px;">
                Code Update: <span id="html-update-time">lädt...</span>
            </div>
        </div>
    </header>

    <div class="controls-wrapper">
        <div class="controls currency-controls glass-panel" style="padding: 10px;">
            <button onclick="setCurrency('EUR')" id="curr-EUR" class="active">EUR / ARS</button>
            <button onclick="setCurrency('USD')" id="curr-USD">USD / ARS</button>
            <button onclick="setCurrency('GBP')" id="curr-GBP">GBP / ARS</button>
            <button onclick="setCurrency('CAD')" id="curr-CAD">CAD / ARS</button>
        </div>

        <div class="controls glass-panel" style="padding: 10px;">
            <button onclick="setTimeFilter('7')" id="btn-7">7 Tage</button>
            <button onclick="setTimeFilter('30')" id="btn-30">30 Tage</button>
            <button onclick="setTimeFilter('90')" id="btn-90" class="active">90 Tage</button>
            <button onclick="setTimeFilter('all')" id="btn-all">Alle</button>
            <button onclick="toggleCustomDate()" id="btn-custom">Zeitraum...</button>
            
            <div class="date-picker-group" id="date-pickers">
                <input type="date" id="date-start" onchange="applyFilters()">
                <span style="color:var(--text-muted)">bis</span>
                <input type="date" id="date-end" onchange="applyFilters()">
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="list-container glass-panel" id="rate-list"></div>
        <div class="chart-container glass-panel"><canvas id="rateChart"></canvas></div>
    </div>

    <script>
        let fullData = [];
        let chartInstance = null;
        let currentCurrency = 'EUR';
        let currentTimeFilter = '90';

        // Update Bot Fetch
        fetch('https://api.github.com/repos/Adrian-Fe/WU-drawer/commits?path=index.html&page=1&per_page=1')
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const commitDate = new Date(data[0].commit.author.date);
                    document.getElementById('html-update-time').innerText = commitDate.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' Uhr';
                }
            }).catch(() => document.getElementById('html-update-time').innerText = 'Offline');

        // CSV Fetch
        fetch('rates.csv?v=' + new Date().getTime())
            .then(res => res.text())
            .then(csv => {
                const parsed = Papa.parse(csv, { header: true }).data;

                fullData = parsed.filter(r => r.exchange_rate && r.exchange_rate !== 'N/A' && r.timestamp_utc).map(r => {
                    const isoDate = r.timestamp_utc.replace(" ", "T").replace(" UTC", "Z");
                    const dateObj = new Date(isoDate);
                    const wuRate = parseFloat(r.exchange_rate);
                    const ibRate = r.interbank_rate && r.interbank_rate !== 'N/A' ? parseFloat(r.interbank_rate) : null;
                    const currency = r.send_currency || 'EUR';

                    return {
                        id: r.timestamp_utc.replace(/[^a-zA-Z0-9]/g, "") + currency,
                        dateObj: dateObj,
                        currency: currency,
                        wuRate: wuRate,
                        ibRate: ibRate
                    };
                });

                fullData.sort((a, b) => a.dateObj - b.dateObj);
                applyFilters();
            });

        function setCurrency(curr) {
            currentCurrency = curr;
            document.querySelectorAll('.currency-controls button').forEach(b => b.classList.remove('active'));
            document.getElementById(`curr-${curr}`).classList.add('active');
            applyFilters();
        }

        function setTimeFilter(days) {
            currentTimeFilter = days;
            document.querySelectorAll('.controls:not(.currency-controls) button').forEach(b => b.classList.remove('active'));
            document.getElementById('date-pickers').classList.remove('show');
            if (days === 'custom') {
                document.getElementById('btn-custom').classList.add('active');
                document.getElementById('date-pickers').classList.add('show');
            } else {
                document.getElementById(`btn-${days}`).classList.add('active');
                applyFilters();
            }
        }

        function toggleCustomDate() { setTimeFilter('custom'); }

        function getSpreadPct(item) {
            if (!item || item.ibRate === null || item.ibRate === undefined || item.ibRate === 0) {
                return null;
            }
            return ((item.wuRate - item.ibRate) / item.ibRate) * 100;
        }

        function applyFilters() {
            let filtered = fullData.filter(d => d.currency === currentCurrency);

            for(let i = 0; i < filtered.length; i++) {
                if (i === 0) {
                    filtered[i].trendPct = 0;
                } else {
                    const prev = filtered[i-1].wuRate;
                    filtered[i].trendPct = ((filtered[i].wuRate - prev) / prev) * 100;
                }
            }

            if (currentTimeFilter !== 'all' && currentTimeFilter !== 'custom') {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - parseInt(currentTimeFilter));
                filtered = filtered.filter(d => d.dateObj >= cutoff);
            } else if (currentTimeFilter === 'custom') {
                const start = document.getElementById('date-start').value;
                const end = document.getElementById('date-end').value;
                if(start && end) {
                    const startDate = new Date(start);
                    const endDate = new Date(end);
                    endDate.setHours(23, 59, 59);
                    filtered = filtered.filter(d => d.dateObj >= startDate && d.dateObj <= endDate);
                } else { return; }
            }

            renderList(filtered);
            renderChart(filtered);
        }

        function renderList(data) {
            const listDiv = document.getElementById('rate-list');
            listDiv.innerHTML = '';

            const reversed = [...data].reverse();

            reversed.forEach(item => {
                const dateStr = item.dateObj.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute:'2-digit' });

                let trendHtml = `<div class="item-delta delta-neutral">• 0.00%</div>`;
                if (item.trendPct > 0) trendHtml = `<div class="item-delta delta-up">▲ +${item.trendPct.toFixed(2)}%</div>`;
                else if (item.trendPct < 0) trendHtml = `<div class="item-delta delta-down">▼ ${item.trendPct.toFixed(2)}%</div>`;

                const spreadPct = getSpreadPct(item);
                const spreadText = spreadPct === null ? 'kein Interbank-Vergleich' : (spreadPct >= 0 ? `+${spreadPct.toFixed(1)}% WU-Aufschlag` : `${spreadPct.toFixed(1)}% unter Interbank`);

                const row = document.createElement('div');
                row.className = 'list-item';
                row.id = `list-${item.id}`;
                row.innerHTML = `
                    <div class="item-left">
                        <div class="item-date">${dateStr}</div>
                        <div class="item-rate">${item.wuRate.toFixed(2)} ARS</div>
                        <div class="item-ib">Interbank: ${item.ibRate === null ? 'nicht verfügbar' : item.ibRate.toFixed(2) + ' ARS'} (${spreadText})</div>
                    </div>
                    <div class="item-right">
                        ${trendHtml}
                    </div>
                `;
                listDiv.appendChild(row);
            });
        }

        function renderChart(data) {
            const ctx = document.getElementById('rateChart').getContext('2d');

            const labels = data.map(d => d.dateObj.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }));
            const fullDateLabels = data.map(d => d.dateObj.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }));
            const wuValues = data.map(d => d.wuRate);
            const ibValues = data.map(d => d.ibRate === null ? NaN : d.ibRate);
            const ids = data.map(d => d.id);

            const allRates = [...wuValues, ...ibValues.filter(v => !Number.isNaN(v))];
            const minRate = Math.min(...allRates);
            const maxRate = Math.max(...allRates);
            const padding = (maxRate - minRate) * 0.05 || 2;

            if (chartInstance) chartInstance.destroy();

            const verticalLinePlugin = {
                id: 'verticalLinePlugin',
                afterDatasetsDraw(chart) {
                    const active = chart.tooltip && chart.tooltip.dataPoints && chart.tooltip.dataPoints.length ? chart.tooltip.dataPoints[0] : null;
                    if (!active) return;

                    const xScale = chart.scales.x;
                    const yScale = chart.scales.y;
                    if (!xScale || !yScale) return;

                    const xPixel = xScale.getPixelForValue(active.dataIndex);
                    const yTop = yScale.top;
                    const yBottom = yScale.bottom;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(xPixel, yTop);
                    ctx.lineTo(xPixel, yBottom);
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = '#60a5fa';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.restore();
                }
            };

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Western Union',
                            data: wuValues,
                            borderColor: '#ffd100',
                            borderWidth: 2.5,
                            pointBackgroundColor: '#1e293b',
                            pointBorderColor: '#ffd100',
                            pointBorderWidth: 2,
                            pointRadius: 3,
                            pointHoverRadius: 7,
                            fill: false,
                            tension: 0.1,
                            order: 1
                        },
                        {
                            label: 'Interbank / Visa',
                            data: ibValues,
                            borderColor: 'rgba(255, 255, 255, 0.25)',
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#64748b',
                            fill: false,
                            tension: 0.1,
                            order: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { left: 0, right: 15, top: 15, bottom: 0 } },
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { color: '#94a3b8', usePointStyle: true, boxWidth: 8 }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.95)',
                            titleColor: '#94a3b8',
                            bodyFont: { size: 13, weight: 'bold' },
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            callbacks: {
                                title: function(context) { return fullDateLabels[context[0].dataIndex] + ' Uhr'; },
                                label: function(context) {
                                    const item = data[context.dataIndex];
                                    const spreadPct = item ? getSpreadPct(item) : null;
                                    const valueText = context.parsed.y.toFixed(2) + ' ARS';
                                    if (spreadPct !== null) {
                                        return context.dataset.label + ': ' + valueText + ' | Spread: ' + (spreadPct >= 0 ? '+' : '') + spreadPct.toFixed(2) + '%';
                                    }
                                    return context.dataset.label + ': ' + valueText;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'category',
                            grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false },
                            ticks: { color: '#94a3b8', maxTicksLimit: 8, maxRotation: 0 }
                        },
                        y: {
                            min: minRate - padding, max: maxRate + padding,
                            grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                            ticks: { color: '#94a3b8', callback: function(value) { return value.toFixed(0); } }
                        }
                    },
                    onHover: (event, chartElement) => {
                        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('highlight'));
                        if (chartElement.length > 0) {
                            const index = chartElement[0].index;
                            const targetId = `list-${ids[index]}`;
                            const listEl = document.getElementById(targetId);

                            if (listEl) {
                                listEl.classList.add('highlight');
                            }
                        }
                    }
                },
                plugins: [verticalLinePlugin]
            });
        }
    </script>
</body>
</html>
