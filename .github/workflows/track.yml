name: Track Western Union EUR/ARS Rate

on:
  schedule:
    # Temporary test schedule: runs every 5 minutes (GitHub minimum interval).
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write # Needed to push CSV commits back to the repo

jobs:
  scrape-and-log:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run rate scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update EUR/ARS rate [skip ci]" && git push)
